name: Documentation site

# Builds docs/ into a website with MkDocs and publishes it with GitHub Pages.
#
# A pull request that touches the documentation only builds it, with --strict, so a
# link that does not resolve on the site turns the job red before it reaches master.
# A push to master builds it and publishes it. Publishing needs Pages set to
# "GitHub Actions" under Settings -> Pages, once.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'bin/docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'bin/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install -r bin/docs/requirements.txt

      - name: Build
        run: mkdocs build --strict

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish documentation site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
